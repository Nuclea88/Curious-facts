<!DOCTYPE hmtl>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Curious facts</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
        <main class = "app-container bg-white shadow-xl rounded-lg p-6 w-full max-w-sm">
            <section id="viewer" class="section-container">
                <h1 class="text-xl font-bold mb-6 text-left">do you know this?</h1>
                <div id="fact" class="min-h-12 text-center italic text-lg mb-6"></div>
                <div id="buttons-container"class="fact-buttons flex flex-col items-center space-y-4 w-full">
                <button hidden id="save-fact-btn" class="btn save-btn w-fit py-3 rounded-full text-white font-bold bg-gradient-to-r from-pink-500 to-fuchsia-600 hover:opacity-90 transition-opacity shadow-lg">
                        Add to favorites</button>
                 <button id="new-fact-btn" class="btn new-btn w-fit py-3 rounded-full text-white font-bold bg-gradient-to-r from-cyan-500 to-teal-600 hover:opacity-90 transition-opacity shadow-lg ">
                    Get curious fact</button>
                 <button id="favorites-btn" class="btn fav-btn w-fit py-3 rounded-full text-white font-bold bg-gradient-to-r from-amber-500 to-orange-600 hover:opacity-90 transition-opacity shadow-lg">
                        See your favorite facts!</button>
                 <div id ='favorite-viewer' class="w-full mt-4 space-y-2"></div>
                </div>
            </section>
        </main>
        <script src="./js/index.js" type="module"></script>
</html>
